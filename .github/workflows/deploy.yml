name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: soliofit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-minimum-50-characters-long-padding-string
          POSTGRES_DB: soliofit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t soliofit-backend:latest backend
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            -t soliofit-frontend:latest frontend
          docker save soliofit-backend:latest soliofit-frontend:latest | gzip > images.tar.gz
      - name: Copy images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "images.tar.gz,docker-compose.yml"
          target: "/home/ubuntu/soliofit/"
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/soliofit
            set -a; . ./backend/.env; set +a
            mkdir -p backups
            PG_CID=$(docker ps -qf name=postgres)
            if [ -n "$PG_CID" ]; then
              docker exec "$PG_CID" pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" \
                | gzip > "backups/pre-deploy-$(date +%F-%H%M).sql.gz"
            else
              echo "WARNING: no postgres container running — skipping pre-deploy backup (expected on first deploy)"
            fi
            gunzip -c images.tar.gz | docker load
            docker compose up -d
            docker image prune -f
            echo "Deploy complete"
